storage:
  id: STORAGE-OUTBOX
  version: 1
  delivery: at_least_once
  statuses: [PENDING, CLAIMED, PUBLISHED, DEAD_LETTER]
  table:
    name: outbox_messages
    primary_key: [message_id]
    columns:
      message_id: {type: varchar, max_length: 64, nullable: false}
      message_type: {type: varchar, max_length: 128, nullable: false}
      schema_version: {type: integer, minimum: 1, nullable: false}
      aggregate_id: {type: varchar, max_length: 128, nullable: true}
      aggregate_version: {type: bigint, minimum: 1, nullable: true}
      partition_key: {type: varchar, max_length: 256, nullable: false}
      envelope: {type: json, nullable: false}
      status: {type: enum, values: [PENDING, CLAIMED, PUBLISHED, DEAD_LETTER]}
      attempt_count: {type: integer, minimum: 0, nullable: false}
      available_at: {type: timestamptz, nullable: false}
      claimed_by: {type: varchar, max_length: 128, nullable: true}
      claim_token: {type: uuid, nullable: true}
      lease_until: {type: timestamptz, nullable: true}
      published_at: {type: timestamptz, nullable: true}
      last_error_code: {type: varchar, max_length: 128, nullable: true}
      last_error_detail: {type: varchar, max_length: 2048, nullable: true}
      created_at: {type: timestamptz, nullable: false}
      updated_at: {type: timestamptz, nullable: false}
    checks:
      PENDING: "claim fields and published_at are null"
      CLAIMED: "claimed_by, claim_token, lease_until are non-null"
      PUBLISHED: "published_at is non-null and claim fields are null"
      DEAD_LETTER: "last_error_code is non-null and claim fields are null"
    indexes:
      - {columns: [status, available_at, created_at], purpose: claim_scan}
      - {columns: [aggregate_id, aggregate_version], purpose: audit}
  claim_policy:
    required_configuration:
      batch_size: {type: integer, minimum: 1, maximum: 1000}
      lease_duration_ms: {type: integer, minimum: 1000, maximum: 300000}
      max_attempts: {type: integer, minimum: 1, maximum: 100}
      initial_retry_delay_ms: {type: integer, minimum: 10, maximum: 60000}
      max_retry_delay_ms: {type: integer, minimum: 10, maximum: 3600000}
      backoff_multiplier: {type: decimal_string, minimum_exclusive: 1, maximum: 10}
      jitter_ratio: {type: decimal_string, minimum: 0, maximum: 1}
    missing_or_invalid_configuration: fail_startup
  transitions:
    - {from: PENDING, operation: claim, to: CLAIMED, guard: available_and_selected}
    - {from: CLAIMED, operation: renew, to: CLAIMED, guard: matching_claim_token}
    - {from: CLAIMED, operation: publish_ack, to: PUBLISHED, guard: matching_claim_token}
    - {from: CLAIMED, operation: publish_failed, to: PENDING, guard: "matching token and attempts below max"}
    - {from: CLAIMED, operation: publish_failed, to: DEAD_LETTER, guard: "matching token and attempts reached max"}
    - {from: CLAIMED, operation: reclaim, to: CLAIMED, guard: lease_expired, action: new_claim_token}
    - {from: DEAD_LETTER, operation: authorized_requeue, to: PENDING, guard: audited_operator_approval}
  semantics:
    claim_selection: "atomic ordered claim using skip-locked or equivalent non-blocking primitive"
    attempt_increment: once_per_claim
    publish_receipt: backbone_acceptance_only
    crash_after_publish_before_ack: duplicate_publication_expected
    consumer_requirement: inbox_or_business_key_idempotency
    ordering: "transport order is not guaranteed, including after reclaim; aggregate_version lets consumers detect, defer, or replay gaps"
    persisted_time_authority: postgresql_transaction_clock
    expired_worker_token: fenced_no_mutation
    infinite_retry: forbidden
    delete_after_publish: forbidden_until_retention_and_audit_policy
  dead_letter:
    alert_required: true
    critical_order_message:
      worker_action: emit_critical_health_and_alert
      supervisor_action: block_recovery_barrier_and_new_risk
      silent_drop: forbidden
    replay:
      same_message_id: required
      new_business_event: forbidden
      approval_and_audit: required
