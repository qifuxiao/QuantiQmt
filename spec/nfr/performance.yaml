nfr:
  id: NFR-PERFORMANCE
  workload: target
  assumptions:
    active_instruments: 2000
    market_peak_messages_per_second: 50000
    strategy_instances: 100
    order_intents_per_second: 500
    broker_reports_per_second: 2000
  latency_p99_ms:
    callback_copy_to_ingress: 1
    market_normalize_to_publish: 3
    strategy_ordinary_evaluation: 8
    risk_evaluation: 4
    oms_command: 4
    approved_to_broker_call_start: 3
    internal_market_to_broker_call_start: 20
    trade_receive_to_order_commit: 10
    trade_commit_to_position_visible: 50
    kill_switch_to_new_intent_blocked: 50
  capacity_rules:
    production_max_of_measured_safe_capacity: 0.60
    queue_warning_ratio: 0.60
    queue_degraded_ratio: 0.80
    reject_new_risk_ratio: 0.95
    report_percentiles: [p50, p95, p99, p99_9, max]
  market_data:
    target_messages_per_second: 50000
    normalize_to_publish_p99_ms: 3
    callback_copy_to_ingress_p99_ms: 1
    queue_capacity: bounded_and_load_tested
    batch_capacity: bounded
    warning_ratio: 0.60
    critical_ratio: 0.80
    overflow_ratio: 0.95
    source_lag_stale_ms: versioned_policy_value
    validation_policy: immutable_version_and_checksum_from_configuration_authority
    snapshot_freshness_clock: injected_UTC_integer_milliseconds
    response_thresholds_as_authority: forbidden
    threshold_order: warning_less_than_critical_less_than_overflow_less_than_or_equal_capacity
    overflow_action: reject_new_with_exact_gap_evidence
    tick_coalesce: forbidden_v1
    forbidden: [unbounded_queue, silent_drop, transaction_or_audit_queue_capacity_sharing]
  forbidden:
    - report_average_only
    - achieve_latency_by_dropping_order_messages
    - weaken_audit_or_risk_for_performance
  risk_measurement:
    clock: monotonic_ns
    total_latency_us: ceil_integer_delta_ns_div_1000
    per_rule_latency_us: "measure each deterministic rule boundary outside the pure evaluator"
    timeout_source: rule_set.evaluation_timeout_us
    timeout_result: "QQ-RISK-4005 TIMEOUT_GUARD REJECT"
    late_pass_replacement: forbidden
    worker_pool: "bounded max_in_flight with zero unbounded queue growth"
    saturation_result: "QQ-RISK-4005 TIMEOUT_GUARD REJECT"
  backtest:
    scheduler_queue_capacity: finite_versioned_policy
    historical_page_max_items: 10000
    historical_pages_per_release_dispatch: finite_versioned_policy
    event_batch_capacity: finite_versioned_policy
    run_event_limit: finite_versioned_policy
    artifact_size_limit: finite_versioned_policy
    host_watchdog: finite_termination_only
    throughput_measurement_is_business_input: false
    deterministic_outcome_may_depend_on_host_speed: false
    capacity_exhaustion: fail_visible_without_drop_reorder_or_completed_claim
    report: [events_per_host_second, virtual_time_ratio, queue_high_watermark, artifact_bytes]
