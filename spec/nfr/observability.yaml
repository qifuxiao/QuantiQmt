nfr:
  id: NFR-OBSERVABILITY
  required_message_fields:
    - message_id
    - correlation_id
    - causation_id
    - source
    - occurred_at
    - schema_version
  required_log_fields:
    - timestamp
    - level
    - service
    - instance
    - environment
    - correlation_id
    - error_code
  transaction_trace_must_include:
    - strategy_decision
    - target_or_order_intent
    - order_registration
    - risk_rule_results
    - oms_transitions
    - execution_attempts
    - broker_reports
    - trades
    - ledger_entries
    - manual_operations
  prohibited_metric_labels:
    - order_id
    - trade_id
    - correlation_id
    - instrument_id
    - raw_account_id
  market_metrics:
    - market_ingress_total{provider,event_type,outcome}
    - market_queue_depth_ratio{provider,event_type}
    - market_source_lag_ms{provider,exchange}
    - market_gap_total{provider,reason}
    - market_overflow_rejected_total{provider,event_type}
    - market_identity_collision_total{provider,event_type}
    - market_contract_validation_failed_total{provider,event_type,stage,reason}
    - market_quality_transition_total{provider,from_state,to_state,reason}
    - market_session_transition_total{exchange,from_state,to_state,reason}
    - market_bar_close_latency_ms{exchange,timeframe_seconds,quality}
  market_metric_forbidden_labels: [instrument_id, message_id, correlation_id, order_id, account_id, subscription_id]
  market_alerts:
    - market_queue_critical
    - market_source_stale
    - market_gap_unresolved
    - market_unavailable
    - market_recovery_failed
    - market_session_calendar_mismatch
    - market_watermark_regression
    - market_final_bar_mutation_attempt
    - market_envelope_payload_binding_mismatch
    - market_checksum_or_identity_mismatch
    - market_false_healthy_attempt
  safety_alerts:
    - dual_oms_leader
    - order_message_dropped
    - audit_unavailable
    - unknown_order_stuck
    - reconciliation_p0_p1
    - stale_fencing_token
  risk_internal_audit_output_required_fields:
    - decision
    - evaluated_at
    - total_latency_us
    - evaluation_timeout_us
    - completed_rule_count
    - rule_timings
  risk_internal_rule_result_required_fields:
    - evaluation_index
    - rule_id
    - phase
    - scope
    - scope_id
    - priority
    - metric
    - result
    - reason_code
    - measured_value
    - limit_value
    - exception_applied
  risk_internal_rule_timing_required_fields:
    - evaluation_index
    - rule_id
    - latency_us
  risk_internal_joined_rule_audit_view:
    join_key: [evaluation_index, rule_id]
    required_sources: [decision.rule_results, rule_timings]
    includes_rule_result_and_latency: true
    semantic_validator_required: true
    cardinality: exactly_one_timing_per_result_including_timeout_guard
    order: contiguous_evaluation_index_from_zero
  market_validation_policy:
    required_log_fields: [provider, generation, calendar_version, session_id, policy_version, policy_checksum, tzdb_version, outcome, reason_code]
    metrics: [market_policy_validation_failure_total, market_snapshot_freshness_rejection_total, market_health_policy_mismatch_total, market_tzdb_resolution_failure_total]
    high_cardinality_labels_forbidden: [instrument_id, message_id, correlation_id]
    alerts: [POLICY_CHECKSUM_COLLISION, SNAPSHOT_FRESHNESS_REJECTION_SURGE, HEALTH_THRESHOLD_MISMATCH, TZDB_MISSING_OR_UNKNOWN]
  risk_audit_semantic_invariants:
    - unique_rule_result_rule_id
    - result_and_timing_indices_contiguous_from_zero
    - timing_order_matches_result_order
    - exact_result_timing_identity_and_cardinality
    - total_latency_not_less_than_timing_sum
    - origin_specific_completed_rule_count
    - timeout_guard_unique_last_timed_and_excluded_from_completed_count
  risk_v2_authoritative_audit_required_fields:
    - schema_version
    - decision
    - evaluated_at
    - total_latency_us
    - evaluation_timeout_us
    - completed_rule_count
    - rule_timings
  risk_v1_compatibility_audit_required_fields:
    - decision_id
    - order_id
    - expected_order_version
    - decision
    - rule_set_version
    - snapshot_versions
    - rule_results
    - evaluated_at
  risk_metrics:
    - "risk_evaluation_latency_us histogram"
    - "risk_completion_latency_us histogram"
    - "risk_rule_latency_us histogram"
    - "risk_decisions_total{decision,origin,error_code} counter"
    - "risk_fail_closed_total{reason} counter"
  risk_metric_forbidden_labels: [order_id, account_id, portfolio_id, strategy_id, instrument_id, correlation_id, decision_id, rule_id]
  risk_metric_measurements:
    risk_evaluation_latency_us: exact_valid_audit_total_latency_us_sample_with_lower_bounds
    risk_rule_latency_us: exact_valid_audit_rule_timings_latency_us
    risk_completion_latency_us: full_caller_terminal_latency_including_finalization_and_failure_cleanup
    no_valid_audit: completion_and_local_fail_closed_only_no_decision_or_rule_samples
    consistency: never_modify_authoritative_audit_to_fit_telemetry
  risk_telemetry:
    interface: PORTS-RISK.RiskTelemetry
    admission: try_only_before_batch_construction
    consumer_workers: 1
    pending_slots: 1
    buffer_count: 2
    buffer_bytes: 524288
    max_rule_samples: 8192
    max_summary_samples: 4
    numeric_encoding: uint64_unsigned_fixed_8_bytes
    label_encoding: fixed_enum_ids_no_dynamic_strings
    storage: reserved_buffer_only_no_dynamic_batch_or_unbounded_integer_encoding
    oversize_or_unrepresentable: FULL_drop_whole_batch_without_clamping_audit
    drop_reasons: [FULL, CONTENDED, OBSERVER_EXCEPTION, CLOSED]
    counter_unit: batch_loss_observations_not_exact_lost_samples
    counter_semantics: uint64_saturating_possibly_missed_LOWER_BOUND
    counter_update: one_try_lock_non_nested_no_retry_no_recursive_metrics
    diagnostic_states: [AVAILABLE, BUSY]
    diagnostic_fields: [state, semantics, lower_bounds, saturated, closed]
    diagnostic_busy: no_counter_or_closed_snapshot_no_zero_substitution
    diagnostic_available: coherent_local_snapshot_not_complete_loss_accounting
    zero_counter_proves_no_loss: false
    observer_exception: prefix_side_effects_possible_drop_remaining_batch_without_retry
    observer_replacement: forbidden
    blocked_observer: retains_buffer_and_worker_until_actual_exit
    close: try_only_close_admission_drop_pending_leave_inflight_owned_no_trading_path_join
    retries: 0
    authoritative_audit_or_outbox_loss: forbidden
    same_process_arbitrary_observer_isolation: not_guaranteed
  strategy_runtime_audit:
    event: strategy.state_changed.v1
    required_fields: [strategy_id, strategy_version, generation, from_state, to_state, reason_code, correlation_id, occurred_at]
    required_reasons: [CALLBACK_TIMEOUT, CALLBACK_EXCEPTION, OUTPUT_REJECTED, STALE_GENERATION, CHECKPOINT_INVALID, RESOURCE_LIMIT, DEPENDENCY_STALE]
    forbidden_payloads: [broker_credentials, database_credentials, raw_secret, arbitrary_network_target]
  control_plane:
    required_context_fields: [message_id, correlation_id, causation_id, source, service, instance, environment, occurred_at, received_at, error_code]
    sensitive_values_forbidden: [secret, credential, password, access_token, private_key, raw_account_identifier]
    metric_names:
      - control_command_total{command,outcome,reason}
      - config_activation_total{domain,outcome,mode}
      - config_activation_latency_ms{domain,mode}
      - kill_switch_transition_total{scope_type,desired_state,outcome}
      - leader_fencing_rejection_total{component,reason}
      - recovery_barrier_transition_total{from_state,to_state,reason}
      - critical_lag_seconds{source,component}
      - audit_record_rejection_total{source,reason}
    alert_definition_label_allowlist: [severity, component, alert_code, environment, policy_version]
    runtime_metric_label_allowlists:
      control_command_total: [command, outcome, reason]
      config_activation_total: [domain, outcome, mode]
      config_activation_latency_ms: [domain, mode]
      kill_switch_transition_total: [scope_type, desired_state, outcome]
      leader_fencing_rejection_total: [component, reason]
      recovery_barrier_transition_total: [from_state, to_state, reason]
      critical_lag_seconds: [source, component]
      audit_record_rejection_total: [source, reason]
    metric_label_forbidden: [scope_id, order_id, trade_id, correlation_id, instrument_id, account_id, strategy_id, message_id, raw_account_id]
    scope_metric_label: scope_type_only
    alert_taxonomy: [P0, P1, P2]
    critical_lag_policy: {authoritative_source: source_received_watermark_delta, threshold_version_required: true, sustained_window_seconds_required: true, recovery_window_seconds_required: true}
    alert_state_authority: forbidden
    semantic_validator: CONTRACT-CONTROL-SEMANTIC-VALIDATION-V1
