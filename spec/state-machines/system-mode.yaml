machine:
  id: SM-SYSTEM-MODE
  initial: STARTING
  ordering: [NORMAL, DEGRADED, SAFE, HALTED]
  states:
    STARTING: {new_risk: forbidden}
    NORMAL: {new_risk: allowed}
    DEGRADED: {new_risk: scoped}
    SAFE: {new_risk: forbidden, cancel: allowed, approved_reduce_risk: allowed}
    HALTED: {new_risk: forbidden, recovery_controls_only: true}
  transitions:
    - {from: STARTING, event: RecoveryPassed, to: NORMAL, guard: recovery_barrier_open}
    - {from: STARTING, event: PartialAvailability, to: SAFE, guard: true}
    - {from: NORMAL, event: NonCriticalDegradation, to: DEGRADED, guard: true}
    - {from: NORMAL, event: SafetyUncertain, to: SAFE, guard: true}
    - {from: DEGRADED, event: SafetyUncertain, to: SAFE, guard: true}
    - {from: SAFE, event: SevereInconsistency, to: HALTED, guard: true}
    - {from: DEGRADED, event: HealthyWindowPassed, to: NORMAL, guard: policy_allows}
    - {from: SAFE, event: RepairApproved, to: DEGRADED, guard: reconciliation_passed}
    - {from: HALTED, event: DualApprovedRecovery, to: SAFE, guard: recovery_evidence_valid}
  invariants:
    - "when scopes conflict, stricter mode wins"
    - "dependency reconnect alone never restores NORMAL"
