machine:
  id: SM-SYSTEM-MODE
  initial: STARTING
  ordering: [NORMAL, DEGRADED, SAFE, HALTED]
  states:
    STARTING: {new_risk: forbidden}
    NORMAL: {new_risk: allowed}
    DEGRADED: {new_risk: scoped}
    SAFE: {new_risk: forbidden, cancel: allowed, approved_reduce_risk: allowed}
    HALTED: {new_risk: forbidden, recovery_controls_only: true}
  transitions:
    - {from: STARTING, event: RecoveryPassed, to: NORMAL, guard: recovery_barrier_open_and_verified}
    - {from: STARTING, event: PartialAvailability, to: SAFE, guard: true}
    - {from: NORMAL, event: NonCriticalDegradation, to: DEGRADED, guard: true}
    - {from: NORMAL, event: SafetyUncertain, to: SAFE, guard: true}
    - {from: DEGRADED, event: SafetyUncertain, to: SAFE, guard: true}
    - {from: SAFE, event: SevereInconsistency, to: HALTED, guard: true}
    - {from: DEGRADED, event: HealthyWindowPassed, to: NORMAL, guard: policy_allows}
    - {from: SAFE, event: RepairApproved, to: DEGRADED, guard: reconciliation_passed}
    - {from: HALTED, event: DualApprovedRecovery, to: SAFE, guard: recovery_evidence_valid}
  invariants:
    - "when scopes conflict, stricter mode wins"
    - "dependency reconnect alone never restores NORMAL"
    - "a closed or invalidated recovery barrier rejects new OrderIntent and Risk approval"
    - "kill switch ON blocks new risk while preserving cancel, recovery and approved reduce-risk capacity"
    - "control plane never mutates OMS business state or bypasses Risk/Execution"
  control_guards:
    recovery_barrier_open_and_verified_requires: [barrier_present, barrier_state_OPEN, opened_at_present, CONFIG_VERIFIED, MARKET_FRESH, AUDIT_AVAILABLE, RECONCILIATION_COMPLETE, LEASE_FENCED, OUTBOX_HEALTHY]
    recovery_passed_authority_input: RECOVERY_BARRIER_AUTHORITY_FACT
    recovery_passed_authority_binding: [scope, barrier_id, generation, strictly_incremented_authority_version, canonical_checksum, evidence_and_aggregate_digests, policy_and_authorization, leader_lease_and_fencing, exact_six_ACCEPTED_gate_facts, freshness]
    kill_switch_on_allows: [CANCEL, RECOVERY, APPROVED_REDUCE_RISK]
    kill_switch_on_forbids: [NEW_ORDER_INTENT, NEW_RISK_APPROVAL]
    stale_lease_or_fencing_token: reject_without_side_effect
