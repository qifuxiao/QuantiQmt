machine:
  id: SM-ORDER
  aggregate: Order
  initial: REGISTERED
  terminal_semantics: "terminal blocks new commands, but authoritative late Broker facts may perform explicit correction transitions"
  states:
    REGISTERED: {terminal: false}
    RISK_PENDING: {terminal: false}
    APPROVED: {terminal: false}
    SUBMITTING: {terminal: false}
    SUBMIT_UNKNOWN: {terminal: false}
    SUBMITTED: {terminal: false}
    PARTIALLY_FILLED: {terminal: false}
    CANCEL_PENDING: {terminal: false}
    CANCEL_UNKNOWN: {terminal: false}
    SUSPENDED: {terminal: false}
    REJECTED: {terminal: true}
    CANCELED: {terminal: true}
    FILLED: {terminal: true}
    EXPIRED: {terminal: true}
    FAILED: {terminal: true}
  transitions:
    - {from: REGISTERED, event: StartRisk, to: RISK_PENDING, guard: snapshots_available, action: RequestRiskEvaluation}
    - {from: RISK_PENDING, event: RiskPassed, to: APPROVED, guard: expected_version_matches, action: PersistOrderApproved}
    - {from: RISK_PENDING, event: RiskRejected, to: REJECTED, guard: expected_version_matches, action: PersistOrderRejected}
    - {from: APPROVED, event: Dispatch, to: SUBMITTING, guard: leader_and_trading_allowed, action: StartExecutionAttempt}
    - {from: SUBMITTING, event: BrokerAccepted, to: SUBMITTED, guard: report_uniquely_correlated, action: MergeBrokerReport}
    - {from: SUBMITTING, event: BrokerRejected, to: REJECTED, guard: outcome_definite, action: MergeBrokerReport}
    - {from: SUBMITTING, event: OutcomeUnknown, to: SUBMIT_UNKNOWN, guard: true, action: ScheduleReconciliation}
    - {from: SUBMIT_UNKNOWN, event: ReconcileFoundActive, to: SUBMITTED, guard: unique_broker_match, action: ImportBrokerFacts}
    - {from: SUBMIT_UNKNOWN, event: ReconcileFoundRejected, to: REJECTED, guard: unique_broker_match_and_definite_rejection, action: ImportBrokerFacts}
    - {from: SUBMIT_UNKNOWN, event: ReconcileFoundCanceled, to: CANCELED, guard: unique_broker_match_and_definite_canceled, action: ImportBrokerFacts}
    - {from: SUBMIT_UNKNOWN, event: ReconcileFoundExpired, to: EXPIRED, guard: unique_broker_match_and_definite_expired, action: ImportBrokerFacts}
    - {from: SUBMIT_UNKNOWN, event: PartialTrade, to: PARTIALLY_FILLED, guard: cum_strictly_increases_below_quantity, action: RecordTrade}
    - {from: SUBMIT_UNKNOWN, event: FullTrade, to: FILLED, guard: cum_equals_quantity, action: RecordTrade}
    - {from: SUBMIT_UNKNOWN, event: ReconcileConfirmedAbsent, to: FAILED, guard: visibility_window_passed, action: PersistSubmitFailed}
    - {from: SUBMIT_UNKNOWN, event: ReconcileAmbiguous, to: SUSPENDED, guard: true, action: OpenReconciliationCase}
    - {from: SUBMITTED, event: PartialTrade, to: PARTIALLY_FILLED, guard: cum_between_zero_and_quantity, action: RecordTrade}
    - {from: PARTIALLY_FILLED, event: PartialTrade, to: PARTIALLY_FILLED, guard: cum_strictly_increases_below_quantity, action: RecordTrade}
    - {from: SUBMITTED, event: FullTrade, to: FILLED, guard: cum_equals_quantity, action: RecordTrade}
    - {from: PARTIALLY_FILLED, event: FullTrade, to: FILLED, guard: cum_equals_quantity, action: RecordTrade}
    - {from: SUBMITTED, event: BrokerExpired, to: EXPIRED, guard: broker_confirms_expired, action: MergeBrokerReport}
    - {from: PARTIALLY_FILLED, event: BrokerExpired, to: EXPIRED, guard: broker_confirms_expired_and_leaves_positive, action: MergeBrokerReport}
    - {from: SUBMITTED, event: RequestCancel, to: CANCEL_PENDING, guard: order_not_terminal, action: StartCancelAttempt}
    - {from: PARTIALLY_FILLED, event: RequestCancel, to: CANCEL_PENDING, guard: leaves_positive, action: StartCancelAttempt}
    - {from: CANCEL_PENDING, event: CancelConfirmed, to: CANCELED, guard: broker_confirms_canceled, action: MergeBrokerReport}
    - {from: CANCEL_PENDING, event: PartialTrade, to: CANCEL_PENDING, guard: cum_strictly_increases_below_quantity, action: RecordTrade}
    - {from: CANCEL_PENDING, event: OutcomeUnknown, to: CANCEL_UNKNOWN, guard: true, action: ScheduleReconciliation}
    - {from: CANCEL_PENDING, event: FullTrade, to: FILLED, guard: cum_equals_quantity, action: RecordTrade}
    - {from: CANCEL_PENDING, event: BrokerExpired, to: EXPIRED, guard: broker_confirms_expired_and_leaves_positive, action: MergeBrokerReport}
    - {from: CANCEL_UNKNOWN, event: ReconcileFoundActive, to: SUBMITTED, guard: unique_broker_match_and_cum_zero, action: ImportBrokerFacts}
    - {from: CANCEL_UNKNOWN, event: ReconcileFoundPartial, to: PARTIALLY_FILLED, guard: unique_broker_match_and_cum_between_zero_and_quantity, action: ImportBrokerFacts}
    - {from: CANCEL_UNKNOWN, event: ReconcileFoundExpired, to: EXPIRED, guard: unique_broker_match_and_definite_expired, action: ImportBrokerFacts}
    - {from: CANCEL_UNKNOWN, event: ReconcileCancelRejectedActive, to: SUBMITTED, guard: cancel_rejected_and_trade_derived_cum_zero, action: ImportBrokerFacts}
    - {from: CANCEL_UNKNOWN, event: ReconcileCancelRejectedPartial, to: PARTIALLY_FILLED, guard: cancel_rejected_and_trade_derived_cum_between_zero_and_quantity, action: ImportBrokerFacts}
    - {from: CANCEL_UNKNOWN, event: ReconcileFoundRejected, to: SUSPENDED, guard: original_order_rejected_after_cancel_history, action: OpenReconciliationCase}
    - {from: CANCEL_UNKNOWN, event: ReconcileCanceled, to: CANCELED, guard: broker_confirms_canceled, action: ImportBrokerFacts}
    - {from: CANCEL_UNKNOWN, event: PartialTrade, to: CANCEL_UNKNOWN, guard: cum_strictly_increases_below_quantity, action: RecordTrade}
    - {from: CANCEL_UNKNOWN, event: FullTrade, to: FILLED, guard: cum_equals_quantity, action: RecordTrade}
    - {from: CANCEL_UNKNOWN, event: ReconcileAmbiguous, to: SUSPENDED, guard: true, action: OpenReconciliationCase}
    - {from: CANCELED, event: PartialTrade, to: PARTIALLY_FILLED, guard: late_trade_strictly_increases_below_quantity, action: RecordTradeAndOpenDifferenceCase}
    - {from: CANCELED, event: FullTrade, to: FILLED, guard: late_trade_completes_quantity, action: RecordTradeAndOpenDifferenceCase}
    - {from: EXPIRED, event: PartialTrade, to: PARTIALLY_FILLED, guard: late_trade_strictly_increases_below_quantity, action: RecordTradeAndOpenDifferenceCase}
    - {from: EXPIRED, event: FullTrade, to: FILLED, guard: late_trade_completes_quantity, action: RecordTradeAndOpenDifferenceCase}
    - {from: REJECTED, event: PartialTrade, to: PARTIALLY_FILLED, guard: late_trade_strictly_increases_below_quantity, action: RecordTradeAndOpenDifferenceCase}
    - {from: REJECTED, event: FullTrade, to: FILLED, guard: late_trade_completes_quantity, action: RecordTradeAndOpenDifferenceCase}
    - {from: FAILED, event: PartialTrade, to: PARTIALLY_FILLED, guard: late_trade_strictly_increases_below_quantity, action: RecordTradeAndOpenDifferenceCase}
    - {from: FAILED, event: FullTrade, to: FILLED, guard: late_trade_completes_quantity, action: RecordTradeAndOpenDifferenceCase}
    - {from: REGISTERED, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: RISK_PENDING, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: APPROVED, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: SUBMITTING, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: SUBMIT_UNKNOWN, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: SUBMITTED, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: PARTIALLY_FILLED, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: CANCEL_PENDING, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: CANCEL_UNKNOWN, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: CANCELED, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: EXPIRED, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: REJECTED, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: FAILED, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: FILLED, event: FactConflict, to: SUSPENDED, guard: conflicting_same_identity, action: OpenReconciliationCase}
    - {from: SUBMITTING, event: ReportCumulativeMismatch, to: SUSPENDED, guard: report_cumulative_mismatch, action: OpenReconciliationCase}
    - {from: SUBMIT_UNKNOWN, event: ReportCumulativeMismatch, to: SUSPENDED, guard: report_cumulative_mismatch, action: OpenReconciliationCase}
    - {from: SUBMITTED, event: ReportCumulativeMismatch, to: SUSPENDED, guard: report_cumulative_mismatch, action: OpenReconciliationCase}
    - {from: PARTIALLY_FILLED, event: ReportCumulativeMismatch, to: SUSPENDED, guard: report_cumulative_mismatch, action: OpenReconciliationCase}
    - {from: CANCEL_PENDING, event: ReportCumulativeMismatch, to: SUSPENDED, guard: report_cumulative_mismatch, action: OpenReconciliationCase}
    - {from: CANCEL_UNKNOWN, event: ReportCumulativeMismatch, to: SUSPENDED, guard: report_cumulative_mismatch, action: OpenReconciliationCase}
    - {from: CANCELED, event: ReportCumulativeMismatch, to: SUSPENDED, guard: report_cumulative_mismatch, action: OpenReconciliationCase}
    - {from: EXPIRED, event: ReportCumulativeMismatch, to: SUSPENDED, guard: report_cumulative_mismatch, action: OpenReconciliationCase}
    - {from: REJECTED, event: ReportCumulativeMismatch, to: SUSPENDED, guard: report_cumulative_mismatch, action: OpenReconciliationCase}
    - {from: FILLED, event: ReportCumulativeMismatch, to: SUSPENDED, guard: report_cumulative_mismatch, action: OpenReconciliationCase}
    - {from: SUBMITTING, event: ReportCorrelationAmbiguous, to: SUSPENDED, guard: report_correlation_ambiguous, action: OpenReconciliationCase}
    - {from: SUBMIT_UNKNOWN, event: ReportCorrelationAmbiguous, to: SUSPENDED, guard: report_correlation_ambiguous, action: OpenReconciliationCase}
    - {from: SUBMITTED, event: ReportCorrelationAmbiguous, to: SUSPENDED, guard: report_correlation_ambiguous, action: OpenReconciliationCase}
    - {from: PARTIALLY_FILLED, event: ReportCorrelationAmbiguous, to: SUSPENDED, guard: report_correlation_ambiguous, action: OpenReconciliationCase}
    - {from: CANCEL_PENDING, event: ReportCorrelationAmbiguous, to: SUSPENDED, guard: report_correlation_ambiguous, action: OpenReconciliationCase}
    - {from: CANCEL_UNKNOWN, event: ReportCorrelationAmbiguous, to: SUSPENDED, guard: report_correlation_ambiguous, action: OpenReconciliationCase}
    - {from: CANCELED, event: ReportCorrelationAmbiguous, to: SUSPENDED, guard: report_correlation_ambiguous, action: OpenReconciliationCase}
    - {from: EXPIRED, event: ReportCorrelationAmbiguous, to: SUSPENDED, guard: report_correlation_ambiguous, action: OpenReconciliationCase}
    - {from: REJECTED, event: ReportCorrelationAmbiguous, to: SUSPENDED, guard: report_correlation_ambiguous, action: OpenReconciliationCase}
    - {from: FILLED, event: ReportCorrelationAmbiguous, to: SUSPENDED, guard: report_correlation_ambiguous, action: OpenReconciliationCase}
  invariants:
    - "0 <= cum_quantity <= quantity"
    - "cum_quantity is monotonic"
    - "only OMS mutates state"
    - "unknown outcome never triggers blind retry"
    - "non-trade events cannot mutate cum_quantity"
    - "aggregate version is an integer >= 1 and increments once per accepted new fact"
  fact_identity:
    broker_order_report: "broker+account_id+trading_day+report_id"
    broker_trade: "broker+account_id+trading_day+trade_id"
    required_for: [BrokerAccepted, BrokerRejected, BrokerExpired, CancelConfirmed, PartialTrade, FullTrade, FactConflict, ReportCumulativeMismatch, ReportCorrelationAmbiguous, ReconcileFoundActive, ReconcileFoundPartial, ReconcileFoundRejected, ReconcileFoundCanceled, ReconcileFoundExpired, ReconcileCancelRejectedActive, ReconcileCancelRejectedPartial, ReconcileCanceled, ReconcileAmbiguous]
    canonical_fingerprint:
      broker_trade_include: [broker, account_id, trading_day, trade_id, broker_order_id, instrument_id, side, position_effect, price, quantity, commission, tax, trade_time, broker_sequence]
      broker_trade_exclude: [received_at, order_id, client_order_id]
      broker_order_report_include: [report_id, broker, account_id, trading_day, client_order_id, broker_order_id, broker_status, cum_quantity, leaves_quantity, average_price, broker_sequence, raw_error_code, report_time]
      broker_order_report_exclude: [received_at, order_id]
      normalization: "canonical JSON with sorted field names, explicit nulls and unchanged decimal strings"
  merge_rules:
    duplicate_fact: idempotent_no_op_without_version_increment
    stale_non_regressive_report: idempotent_no_op_without_version_increment
    conflicting_same_identity: suspend_and_open_reconciliation_case
    trade_fact_precedence: "broker trade is authoritative and must be recorded during cancel pending/unknown"
    regressive_cumulative_quantity: reject_QQ-OMS-5002
    cumulative_quantity_above_order_quantity: reject_QQ-OMS-5002
    cumulative_source: "sum quantity of accepted unique broker_trade identities; Broker OrderReport cum_quantity is reconciliation evidence only"
    report_cumulative_mismatch: "SUSPENDED + reconciliation case; never replace trade-derived cumulative quantity"
  guards:
    snapshots_available: "account/portfolio/market snapshot identities and quality are supplied and usable"
    expected_version_matches: "command expected_order_version equals current aggregate version"
    leader_and_trading_allowed: "leadership, fencing token and system/account trading mode facts are all valid"
    report_uniquely_correlated: "mandatory BrokerReport identity maps to exactly one order/client_order_id"
    outcome_definite: "Broker report explicitly proves rejection; timeout/transport error is not definite"
    unique_broker_match: "reconciliation finds exactly one Broker order matching stable client_order_id"
    visibility_window_passed: "configured Broker visibility window elapsed and repeated queries confirm absence"
    cum_between_zero_and_quantity: "candidate cumulative = stored trade-derived cumulative + unseen unique Trade.quantity; require 0 < candidate < order quantity"
    cum_strictly_increases_below_quantity: "candidate cumulative = stored trade-derived cumulative + unseen unique Trade.quantity; require stored < candidate < order quantity"
    cum_equals_quantity: "candidate cumulative = stored trade-derived cumulative + unseen unique Trade.quantity; require candidate == order quantity"
    leaves_positive: "order quantity - cumulative quantity > 0"
    broker_confirms_canceled: "definite Broker canceled status is uniquely correlated"
    broker_confirms_expired: "definite uniquely correlated Broker expired status and cum_quantity == 0"
    broker_confirms_expired_and_leaves_positive: "definite expiry, unique correlation and cumulative quantity < quantity"
    unique_broker_match_and_cum_zero: "one active Broker order match and trade-derived cumulative quantity == 0"
    unique_broker_match_and_cum_between_zero_and_quantity: "one active Broker order match and 0 < trade-derived cumulative quantity < quantity"
    unique_broker_match_and_definite_rejection: "one Broker order match with definite rejected status"
    unique_broker_match_and_definite_canceled: "one Broker order match with definite canceled status"
    unique_broker_match_and_definite_expired: "one Broker order match with definite expired status"
    cancel_rejected_and_trade_derived_cum_zero: "definite cancel-request rejection proves original order remains active and trade-derived cumulative quantity == 0"
    cancel_rejected_and_trade_derived_cum_between_zero_and_quantity: "definite cancel-request rejection proves original order remains active and 0 < trade-derived cumulative quantity < quantity"
    original_order_rejected_after_cancel_history: "Broker claims original submit rejection after this aggregate previously entered a valid cancel flow; treat as contradictory history"
    conflicting_same_identity: "persisted identity exists with a different canonical content fingerprint"
    report_cumulative_mismatch: "uniquely correlated OrderReport cum_quantity differs from trade-derived cumulative quantity"
    report_correlation_ambiguous: "one report maps to zero or multiple candidate orders after the visibility window"
    late_trade_strictly_increases_below_quantity: "candidate cumulative = stored trade-derived cumulative + unseen unique Trade.quantity; require stored < candidate < quantity"
    late_trade_completes_quantity: "candidate cumulative = stored trade-derived cumulative + unseen unique Trade.quantity; require candidate == quantity"
  guard_failures:
    snapshots_available: "QQ-RISK-4002; no state/version mutation"
    expected_version_matches: "QQ-COMMON-1003; no state/version mutation"
    leader_and_trading_allowed: "QQ-OMS-5002; no state/version mutation or external action"
    report_uniquely_correlated: "SUSPENDED + reconciliation case when ambiguous; no report facts overwritten"
    outcome_definite: "reject BrokerRejected as QQ-OMS-5002 with no mutation when evidence is insufficient; caller must submit the distinct OutcomeUnknown event to enter SUBMIT_UNKNOWN"
    unique_broker_match: "SUSPENDED + reconciliation case when ambiguous; retain UNKNOWN when not yet visible"
    visibility_window_passed: "idempotent no-op retaining SUBMIT_UNKNOWN until evidence threshold is met"
    quantity_guards: "QQ-OMS-5002; state, cumulative quantity, processed identities and version remain atomically unchanged"
    broker_status_guards: "QQ-OMS-5002 for contradictory definite status; no mutation"
    missing_guard_evidence: "guard failure; no state/version mutation"
  recovery:
    initial_version: 1
    restored_version: "integer >= 1 matching the last committed aggregate event version"
    restored_cumulative_quantity: "0 <= value <= quantity and derived from accepted unique trade facts"
    processed_facts: "restore every accepted BrokerReport/Trade identity with canonical content fingerprint"
    broker_sequences: "restore last observed sequence per broker/account/stream when provided; sequence is ordering evidence, not identity"
    provisional_mappings: "restore client_order_id to broker_order_id candidates and ambiguity status before opening recovery barrier"
