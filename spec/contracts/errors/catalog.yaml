    retry: never_same_transition
  - code: QQ-RECOVERY-8005
    name: REPAIR_AUTHORIZATION_OR_EVIDENCE_STALE
    category: SECURITY
    retry: fresh_evidence_and_new_authorization
  - code: QQ-RECOVERY-8006
    name: REPAIR_HISTORY_MUTATION_FORBIDDEN
    category: SECURITY
    retry: never
  - code: QQ-RECOVERY-8007
    name: REPAIR_OUTCOME_UNKNOWN
    category: UNKNOWN_OUTCOME
    retry: reconcile_same_command_not_reapply
governance:
  reuse_code: forbidden
  unknown_outcome_auto_retry: forbidden
  canonical_explanation: docs/70-Observability/Error-Code-Catalog.md
compatibility:
  version_2_additive_codes: [QQ-OMS-5001, QQ-STORAGE-7001, QQ-STORAGE-7003, QQ-STORAGE-7004, QQ-STORAGE-7006, QQ-RECOVERY-8002]
  version_3_additive_codes: [QQ-RISK-4003, QQ-RISK-4004, QQ-RISK-4005, QQ-RISK-4006, QQ-RISK-4007, QQ-RISK-4008, QQ-RISK-4009, QQ-RISK-4010, QQ-RISK-4011]
  version_4_additive_codes: [QQ-STORAGE-7007, QQ-STORAGE-7008, QQ-STORAGE-7009, QQ-STORAGE-7010, QQ-RECOVERY-8003, QQ-RECOVERY-8004, QQ-RECOVERY-8005, QQ-RECOVERY-8006, QQ-RECOVERY-8007]
  existing_code_meanings_changed: false
