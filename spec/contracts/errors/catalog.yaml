catalog:
  version: 1
  format: "QQ-{DOMAIN}-{NUMBER}"
  ranges:
    COMMON: [1000, 1999]
    MARKET: [2000, 2999]
    STRATEGY: [3000, 3999]
    RISK: [4000, 4999]
    OMS: [5000, 5999]
    EXECUTION: [6000, 6999]
    STORAGE: [7000, 7999]
    RECOVERY: [8000, 8999]
    OPERATIONS: [9000, 9999]
errors:
  - code: QQ-COMMON-1003
    name: VERSION_CONFLICT
    category: CONFLICT
    retry: reread_then_bounded_retry
  - code: QQ-RISK-4001
    name: RISK_REJECTED
    category: BUSINESS
    retry: never
  - code: QQ-RISK-4002
    name: RISK_SNAPSHOT_STALE
    category: BUSINESS
    retry: after_fresh_snapshot
  - code: QQ-OMS-5002
    name: INVALID_ORDER_TRANSITION
    category: BUSINESS
    retry: never
  - code: QQ-EXEC-6003
    name: SUBMIT_OUTCOME_UNKNOWN
    category: UNKNOWN_OUTCOME
    retry: reconcile_not_resubmit
  - code: QQ-EXEC-6004
    name: CANCEL_OUTCOME_UNKNOWN
    category: UNKNOWN_OUTCOME
    retry: reconcile_not_recancel
  - code: QQ-EXEC-6006
    name: STALE_FENCING_TOKEN
    category: SECURITY
    retry: never
  - code: QQ-STORAGE-7002
    name: JOURNAL_COMMIT_FAILED
    category: DEPENDENCY
    retry: context_dependent
  - code: QQ-STORAGE-7005
    name: LEDGER_UNBALANCED
    category: INTERNAL
    retry: never
  - code: QQ-RECOVERY-8001
    name: RECONCILIATION_DIFFERENCE
    category: CONFLICT
    retry: case_workflow
governance:
  reuse_code: forbidden
  unknown_outcome_auto_retry: forbidden
  canonical_explanation: docs/70-Observability/Error-Code-Catalog.md
