catalog:
  version: 4
  format: "QQ-{DOMAIN}-{NUMBER}"
  ranges:
    COMMON: [1000, 1999]
    MARKET: [2000, 2999]
    STRATEGY: [3000, 3999]
    RISK: [4000, 4999]
    OMS: [5000, 5999]
    EXECUTION: [6000, 6999]
    STORAGE: [7000, 7999]
    RECOVERY: [8000, 8999]
    OPERATIONS: [9000, 9999]
errors:
  - code: QQ-COMMON-1003
    name: VERSION_CONFLICT
    category: CONFLICT
    retry: reread_then_bounded_retry
  - code: QQ-RISK-4001
    name: RISK_REJECTED
    category: BUSINESS
    retry: never
  - code: QQ-RISK-4002
    name: RISK_SNAPSHOT_STALE
    category: BUSINESS
    retry: after_fresh_snapshot
  - code: QQ-RISK-4003
    name: RISK_SNAPSHOT_PARTIAL
    category: DATA_QUALITY
    retry: after_complete_snapshot
  - code: QQ-RISK-4004
    name: RISK_SNAPSHOT_VERSION_MISMATCH
    category: CONFLICT
    retry: rebuild_consistent_input
  - code: QQ-RISK-4005
    name: RISK_EVALUATION_TIMEOUT
    category: DEPENDENCY
    retry: never_same_order_version_without_new_input
  - code: QQ-RISK-4006
    name: RISK_SNAPSHOT_UNAVAILABLE
    category: DEPENDENCY
    retry: after_source_recovery
  - code: QQ-RISK-4007
    name: RISK_RULE_SET_INVALID
    category: CONFIGURATION
    retry: after_valid_rule_set_activation
  - code: QQ-RISK-4008
    name: RISK_INPUT_INVALID
    category: DATA_QUALITY
    retry: rebuild_input
  - code: QQ-RISK-4009
    name: RISK_REDUCTION_EVIDENCE_INVALID
    category: BUSINESS
    retry: after_fresh_position_evidence
  - code: QQ-RISK-4010
    name: RISK_SNAPSHOT_TIMEOUT
    category: DEPENDENCY
    retry: after_snapshot_builder_recovery
  - code: QQ-RISK-4011
    name: RISK_RULE_SET_VERSION_MISMATCH
    category: CONFLICT
    retry: rebuild_input_with_active_rule_set
  - code: QQ-OMS-5001
    name: INVALID_ORDER_INTENT
    category: BUSINESS
    retry: never
  - code: QQ-OMS-5002
    name: INVALID_ORDER_TRANSITION
    category: BUSINESS
    retry: never
  - code: QQ-EXEC-6003
    name: SUBMIT_OUTCOME_UNKNOWN
    category: UNKNOWN_OUTCOME
    retry: reconcile_not_resubmit
  - code: QQ-EXEC-6004
    name: CANCEL_OUTCOME_UNKNOWN
    category: UNKNOWN_OUTCOME
    retry: reconcile_not_recancel
  - code: QQ-EXEC-6006
    name: STALE_FENCING_TOKEN
    category: SECURITY
    retry: never
  - code: QQ-STORAGE-7001
    name: IDEMPOTENCY_CONFLICT
    category: CONFLICT
    retry: never
  - code: QQ-STORAGE-7002
    name: JOURNAL_COMMIT_FAILED
    category: DEPENDENCY
    retry: context_dependent
  - code: QQ-STORAGE-7003
    name: SNAPSHOT_INVALID
    category: DATA_QUALITY
    retry: full_journal_replay
  - code: QQ-STORAGE-7004
    name: OUTBOX_CLAIM_LOST
    category: CONFLICT
    retry: reclaim_or_new_claim
  - code: QQ-STORAGE-7005
    name: LEDGER_UNBALANCED
    category: INTERNAL
    retry: never
  - code: QQ-STORAGE-7006
    name: UNIQUE_IDENTIFIER_COLLISION
    category: CONFLICT
    retry: regenerate_before_side_effect_then_bounded_retry
  - code: QQ-STORAGE-7007
    name: LEDGER_ACCOUNT_UNAVAILABLE
    category: DATA_QUALITY
    retry: after_account_configuration_repair
  - code: QQ-STORAGE-7008
    name: LEDGER_SCOPE_CURRENCY_MISMATCH
    category: DATA_QUALITY
    retry: never_same_payload
  - code: QQ-STORAGE-7009
    name: ACCOUNTING_IDENTITY_CONFLICT
    category: CONFLICT
    retry: reconciliation_case
  - code: QQ-STORAGE-7010
    name: PROJECTION_VERSION_OR_SEQUENCE_REGRESSION
    category: CONFLICT
    retry: verified_replay_after_reread
  - code: QQ-RECOVERY-8001
    name: RECONCILIATION_DIFFERENCE
    category: CONFLICT
    retry: case_workflow
  - code: QQ-RECOVERY-8002
    name: ORDER_JOURNAL_CORRUPTED
    category: DATA_QUALITY
    retry: never_until_operator_repair
  - code: QQ-RECOVERY-8003
    name: PORTFOLIO_REPLAY_MISMATCH
    category: DATA_QUALITY
    retry: full_verified_ledger_replay_then_case
  - code: QQ-RECOVERY-8004
    name: RECONCILIATION_TRANSITION_INVALID
