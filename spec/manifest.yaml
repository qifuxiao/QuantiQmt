change:
  id: SPEC-0.6-RISK-L4-CONTRACTS
  compatibility: backward_compatible_additive_contracts_events_and_errors
  previous_version: 0.5.0
  public_message_schema_changes: "additive risk.order_evaluated.v2; its standard schema plus mandatory PORTS-RISK semantic validator define audit validity; published risk.order_evaluated.v1 schema and identity remain unchanged as a lossy compatibility projection"
  storage_schema_changes: none
  error_catalog_change: "catalog v3 adds QQ-RISK-4003 through QQ-RISK-4011; existing meanings unchanged"
  runtime_code_change: none
  semantic_validation_change: "RiskAuditOutput requires fail-closed cross-field semantic validation before v1 projection, v1/v2 Outbox persistence, or Execution; timeout guard is last and timed but excluded from completed_rule_count"
  internal_contracts_added: [CONTRACT-RISK-INPUT-V1, CONTRACT-RISK-RULE-SET-V1, CONTRACT-RISK-DECISION-V1, CONTRACT-RISK-AUDIT-OUTPUT-V1, PORTS-RISK]
  public_contracts_added: [CONTRACT-RISK-ORDER-EVALUATED-V2]
  task_queue_change: "TASK-015 activated; TASK-005 remains blocked until TASK-015 is independently reviewed and marked completed, after which its frozen contracts are implementation-ready"
  affected_tasks: [TASK-005, TASK-006, TASK-015, TASK-022, TASK-025]
  deployment_order:
    - merge_and_independently_review_task_015_specs
    - implement_and_activate_task_005_against_spec_0.6.1
    - enable_spec_0.6.1_risk_evaluator_and_atomic_v2_authoritative_plus_v1_compatibility_audit_outbox
  migration:
    runtime_data: not_applicable
    public_events: "no backfill; new decisions atomically persist authoritative risk.order_evaluated.v2 plus unchanged lossy risk.order_evaluated.v1 compatibility projection until all v1 consumers migrate"
    rule_sets: "validate candidate RuleSet against CONTRACT-RISK-RULE-SET-V1 and content_hash before activation; no legacy implicit rule configuration may be auto-converted"
    task_queue: "TASK-005 may be activated only after independent Review moves TASK-015 to completed"
    destructive_backfill: forbidden
  rollback:
    runtime_data: not_applicable
    public_events: "rollback consumers to v1 is wire-compatible but loses complete typed audit for new decisions; keep trading fail-closed unless authoritative v2 persistence remains enabled"
    rule_sets: "keep trading fail-closed and reactivate the last independently validated immutable RuleSet; do not synthesize permissive defaults"
    task_queue: "return TASK-005 to blocked if any L4 contract ambiguity is found; no persisted production data is changed by this task"
