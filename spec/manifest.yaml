change:
  id: SPEC-0.11.0-OBSERVABILITY-CONTROL-CONTRACTS
  compatibility: additive_control_events_and_internal_dtos_before_first_release; existing_public_messages_unchanged; release_prohibited_until_independent_review_and_runtime_owner_delivery
  previous_version: 0.10.0
  public_message_schema_changes: "activates previously planned system.mode_changed.v1, system.component_health_changed.v1, system.kill_switch_changed.v1 and config.version_activated.v1 with fail-closed schemas; no previously active public schema changes"
  storage_schema_changes: "defines logical ActiveVersion, control audit and recovery barrier evidence; no database object or migration is created"
  error_catalog_change: none
  runtime_code_change: "none in TASK-022; TASK-025 remains blocked and owns future ControlPlane/Observability runtime implementation only after TASK-022 trusted completion"
  review_change: none
  contract_change: "adds ControlPlane DTOs, four system/config events, envelope and redaction bindings, config activation/rollback, kill switch, lease/fencing and recovery barrier contracts; existing active schemas remain unchanged"
  semantic_validation_change: "adds CONTRACT-CONTROL-SEMANTIC-VALIDATION-V1 with one canonical validate_control_message entrypoint before publish, outbox persistence, command dispatch, state transition and recovery restore; schema-only probes never authorize side effects; enforces correlation, redaction, immutable typed config component authority, strict accepted recovery-barrier authority, single market freshness evidence, exact system-mode transitions, fencing and complete recovery evidence"
  internal_contracts_added: [CONTRACT-CONTROL-PLANE-V1, CONTRACT-CONTROL-SEMANTIC-VALIDATION-V1, PORTS-CONTROL, WF-CONTROL-PLANE]
  public_contracts_added: [system.mode_changed.v1, system.component_health_changed.v1, system.kill_switch_changed.v1, config.version_activated.v1]
  task_queue_change: "TASK-022 remains active/draft/in-progress pending independent Review; TASK-025 remains blocked and constrained to the frozen contracts; no other task changes state"
  affected_tasks: [TASK-022, TASK-025]
  deployment_order:
    - preserve_TASK_020_trusted_market_contracts
    - independently_review_and_merge_TASK_022_control_contracts
    - human_authorize_TASK_022_closeout_with_trusted_delivery_evidence
    - keep_TASK_025_blocked_until_TASK_022_trusted_completed
    - separately_human_authorize_TASK_025_runtime_implementation
    - generate_reviewed_immutable_schema_bundle_for_future_control_runtime
    - deploy_control_schema_consumers_before_control_publishers
    - activate_immutable_config_and_recovery_policies_before_control_traffic
  migration:
    runtime_data: "not applicable in TASK-022 because no Control runtime is implemented; TASK-025 must load only a reviewed immutable manifest-indexed schema bundle and fail closed on missing, tampered or mismatched content"
    public_events: "new event names have no historical published payload, so Review corrections are folded into V1 before first release; deploy accepted readers and immutable bundle before future publishers and reject unknown versions fail-closed"
    storage: "no migration is created or authorized; future persistence requires independently authorized expand-only storage work"
    task_queue: "TASK-022 remains active; TASK-025 remains blocked on TASK-004 and TASK-022; no downstream activation"
    historical_evidence: "missing upstream ranges remain explicit GAP/UNAVAILABLE evidence and are never inferred or silently backfilled"
    destructive_backfill: forbidden
  rollback:
    runtime_data: not_applicable_no_runtime_change
    public_events: "before runtime adoption revert only unimplemented routes; after adoption stop publishers before readers and preserve every emitted event, gap and quality record"
    task_queue: "keep TASK-022 active until independent Review; keep TASK-025 and downstream tasks blocked"
    contracts: "never reuse the four public names or weaken V1 meaning; rollback stops publishers, retains compatible readers and the last reviewed immutable schema bundle, and preserves collision/checksum/gap/quality evidence"
    storage: "no database rollback in TASK-022; future rollback preserves control audit, ActiveVersion, barrier and fencing evidence"
    release: prohibited
