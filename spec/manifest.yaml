change:
  id: SPEC-0.15.0-RISK-RUNTIME-SCHEMA-BUNDLE
  compatibility: additive_internal_Risk_output_schema_identities_and_runtime_bundle_validation; public_MessageEnvelope_Event_DTO_error_reason_rule_order_timeout_reduce_only_metric_and_state_semantics_unchanged
  previous_version: 0.14.0
  public_message_schema_changes: none
  storage_schema_changes: none
  error_catalog_change: none
  runtime_code_change: package_resource_only_checksum_verified_Risk_schema_graph_and_shared_schema_semantic_freeze_boundary
  review_change: requires_independent_Review_of_exact_TASK_029_Head_before_TASK_005_may_be_separately_activated
  contract_change: adds_formal_RuleResult_and_RuleTiming_fragment_identities_and_routes_existing_Decision_Audit_and_v2_through_one_graph
  semantic_validation_change: preserves_PORTS_RISK_first_failure_order_and_requires_schema_before_semantics_before_deep_freeze
  internal_contracts_added: [CONTRACT-RISK-RULE-RESULT-V1, CONTRACT-RISK-RULE-TIMING-V1]
  public_contracts_added: []
  task_queue_change: TASK_029_remains_active_and_TASK_005_remains_blocked_pending_exact_Head_Review_and_separate_Human_authorization
  affected_tasks: [TASK-005, TASK-029]
  deployment_order:
    - build_and_verify_the_versioned_package_resource
    - deploy_the_verified_reader_and_validator_before_enabling_any_Risk_output_consumer
    - keep_Risk_and_trading_gates_closed_on_bundle_or_validation_failure
    - independently_review_the_exact_TASK_029_Head
    - keep_TASK_005_blocked_until_separate_Human_authority
  migration:
    runtime_data: replace_the_installed_package_bundle_atomically_without_data_backfill_or_source_spec_lookup
    public_messages: unchanged
    storage: none
    task_queue: TASK_029_active_and_TASK_005_blocked
    destructive_backfill: forbidden
  rollback:
    runtime_data: stop_Risk_output_consumers_and_install_a_previous_accepted_package_bundle_without_source_fallback
    public_messages: unchanged
    task_queue: keep_TASK_005_blocked_if_TASK_029_evidence_is_invalidated
    contracts: retain_published_Event_DTO_error_reason_and_state_semantics
    storage: none
    release: prohibited
  release: prohibited
