change:
  id: SPEC-0.14.0-ORDER-REGISTRATION-BINDING-COMPATIBILITY
  compatibility: additive_internal_OrderRegistration_binding_compatibility_contract; public_MessageEnvelope_Event_Command_and_Result_V1_schemas_unchanged; legacy_rows_and_Journal_Snapshot_payloads_remain_byte_and_checksum_stable; runtime_migration_and_release_prohibited_pending_TASK_048
  previous_version: 0.13.0
  public_message_schema_changes: none
  storage_schema_changes: "freezes additive nullable broker varchar(64) and broker_capability_version varchar(128) projection columns, complete-or-unbound and trimmed-bound checks, immutability, no historical backfill, and expand-only idempotent migration/rollback sequencing"
  error_catalog_change: none
  runtime_code_change: none_in_TASK_050
  review_change: "requires independent Review of the exact TASK-050 Head before TASK-048 may be reactivated"
  contract_change: "freezes BOUND(non-null pair) and legacy UNBOUND(null pair) OrderRegistration states, rejects partial binding, requires every new registration to be BOUND before Repository write, and prohibits TASK-048 legacy rebinding"
  semantic_validation_change: "freezes legacy missing-field parsing after raw checksum verification, no injected-null recanonicalization, Journal-authoritative projection/rebuild binding, submit/cancel rejection before dispatch, and prohibition on ambient/current capability inference"
  internal_contracts_added: []
  public_contracts_added: []
  task_queue_change: "creates and activates TASK-050 under 2026-08-27 human authorization; TASK-048 now depends on TASK-050 and remains blocked; TASK-006 and all downstream tasks remain blocked"
  affected_tasks: [TASK-006, TASK-017, TASK-048, TASK-050]
  deployment_order:
    - independently_review_merge_and_close_TASK_050
    - separately_reactivate_TASK_048_after_trusted_TASK_050_closeout
    - enter_SAFE_and_quiesce_registration_writers
    - apply_TASK_048_expand_only_nullable_column_migration_without_backfill
    - deploy_compatible_reader_before_BOUND_writer
    - verify_new_registration_binding_and_legacy_UNBOUND_recovery
    - verify_Journal_Snapshot_projection_and_full_replay_parity
    - keep_Broker_dispatch_disabled_until_TASK_048_trusted_closeout
  migration:
    runtime_data: "none in TASK-050; TASK-048 readers map missing legacy fields or a null pair to UNBOUND only after validating the exact stored Journal/Snapshot checksum and never infer either value"
    public_messages: unchanged
    storage: "none in TASK-050; TASK-048 owns an idempotent expand-only migration adding nullable broker/broker_capability_version columns with complete-or-unbound checks, no backfill and preserved historical rows"
    task_queue: "TASK-050 active; TASK-048 blocked on TASK-050 independent Review and trusted closeout; TASK-006 remains blocked on TASK-005 and TASK-048"
    destructive_backfill: forbidden
  rollback:
    runtime_data: "before TASK-048 adoption revert only TASK-050 contract text/tests; after adoption stop writer and dispatch before reader rollback and preserve BOUND/UNBOUND identity"
    public_messages: unchanged
    task_queue: "keep TASK-048, TASK-006 and downstream tasks blocked if TASK-050 evidence is invalidated"
    contracts: "never reinterpret UNBOUND as BOUND and never remove the requirement for separate reviewed append-only repair semantics"
    storage: "TASK-050 creates no database object; future rollback must preserve additive columns, bindings, Journal, Snapshot and audit evidence and must not backfill, DROP, DELETE or overwrite history"
    release: prohibited
