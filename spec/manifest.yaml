change:
  id: SPEC-0.8.0-EXECUTION-BROKER-CONTRACTS
  compatibility: additive_internal_execution_and_simulator_contracts_existing_public_messages_unchanged
  previous_version: 0.7.1
  public_message_schema_changes: none
  storage_schema_changes: none
  error_catalog_change: none
  runtime_code_change: none
  review_change: none
  contract_change: "freezes ExecutionGateway/BrokerGateway DTOs including typed read failures and BrokerHealth, persisted capability-version binding, operation-specific results, plus deterministic Broker Simulator scenario DSL"
  semantic_validation_change: "adds mandatory scenario/request operation, sequence/reference/fill-bound and capability regex/registered-ID validation before simulation; canonical UNKNOWN reconciliation rules remain fail-closed"
  internal_contracts_added: [CONTRACT-EXECUTION-BROKER-GATEWAY-V1, CONTRACT-BROKER-SCENARIO-V1, PORTS-BROKER-SIMULATOR]
  public_contracts_added: []
  task_queue_change: "TASK-017 remains active; TASK-006 remains blocked but becomes implementation-ready with respect to its execution/simulator contract dependency after independent review"
  affected_tasks: [TASK-006, TASK-017, TASK-021, TASK-024, TASK-026, TASK-027]
  deployment_order:
    - independently_review_and_merge_task_017_contracts
    - human_authorized_task_017_closeout_with_trusted_delivery_evidence
    - keep_task_006_blocked_until_task_005_and_task_017_are_trusted_completed
    - implement_task_006_only_against_the_versioned_contract_snapshot
  migration:
    runtime_data: not_applicable
    public_events: not_applicable
    storage: not_applicable
    task_queue: "no activation or status migration; TASK-006 retains existing dependencies and remains blocked"
    historical_evidence: not_applicable
    destructive_backfill: forbidden
  rollback:
    runtime_data: not_applicable
    public_events: not_applicable
    task_queue: "restore TASK-006 spec_refs and blocking text only; do not activate any task"
    contracts: "remove only the unimplemented 0.8.0 internal schema/interface registrations; public v1 broker/execution messages remain unchanged"
    release: prohibited
