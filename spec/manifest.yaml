change:
  id: SPEC-0.16.0-RISK-FINALIZATION-BOUNDARY
  compatibility: published_wire_Schema_Event_DTO_error_and_Order_state_unchanged; audit_sampling_and_integer_lower_bounds_clarified; new_local_failure_and_diagnostic_interfaces_require_caller_adaptation_and_independent_normative_review
  previous_version: 0.15.0
  public_message_schema_changes: none
  storage_schema_changes: none
  error_catalog_change: none
  runtime_code_change: none
  runtime_bundle_version: 0.15.0
  runtime_bundle_source: 3bee8766ab3bc5a14ea9e1367f7f973c3f9cc6eb
  runtime_bundle_manifest_blob: 1a72adc78638dc223fb263df8beb69a7e2586bb3
  runtime_bundle_compatibility: identical_current_contract_index_file_set_and_bytes_required; old_builder_rejects_0_16_0_manifest; installed_0_15_0_bundle_is_not_a_new_Runner_implementation
  review_change: candidate_boundaries_require_independent_exact_Head_normative_Review_and_Human_acceptance_before_runtime_adoption
  contract_change: sampled_audit_latency_is_not_full_completion_latency; bounded_cleanup_may_return_no_valid_audit; telemetry_drops_are_possibly_missed_lower_bounds
  semantic_validation_change: none_to_published_first_failure_order_or_Schema; final_candidate_fixed_before_Schema_then_semantics_then_deep_freeze
  new_local_interfaces: [RiskRunFailure, RiskTelemetry.try_diagnostics, RiskTelemetry.close]
  measurement_clarification: sampled_total_uses_integer_ceiling_rule_sum_lower_bound_and_timeout_floor; separate_completion_metric_includes_final_validation_freeze_and_handback
  affected_consumers: [OrderApplication, RiskEvaluationRunner, output_factories, telemetry_adapters, diagnostics_operators, performance_acceptance_harness]
  internal_contracts_added: []
  public_contracts_added: []
  task_queue_change: TASK_058_remains_active_and_TASK_005_remains_blocked_pending_separate_Human_replan_and_activation
  affected_tasks: [TASK-005, TASK-058]
  deployment_order:
    - independent_normative_review_and_human_acceptance
    - adapt_callers_to_no_valid_audit_failure_and_lower_bound_diagnostics
    - separate_TASK_005_replan_activation_and_runtime_implementation
    - verify_runtime_deadline_resource_failure_and_performance_boundaries
    - enable_new_runner_only_after_all_consumers_are_compatible
  migration:
    runtime_data: no_rewrite_of_historical_audits_or_0_15_0_package_bundle_no_source_fallback
    public_messages: unchanged
    storage: none
    task_queue: TASK_058_active_and_TASK_005_blocked
    destructive_backfill: forbidden
  rollback:
    runtime_data: stop_new_Runner_and_restore_previous_accepted_compatible_consumers_and_runtime_without_source_fallback_or_audit_rewrite
    trading_gates: closed_until_compatible_consumers_and_runner_are_verified
    public_messages: unchanged
    task_queue: keep_TASK_005_blocked_until_separate_Human_authority
    contracts: retain_published_Event_DTO_error_reason_and_state_semantics
    storage: none
    release: prohibited
  release: prohibited
