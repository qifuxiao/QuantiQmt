change:
  id: SPEC-0.10.0-MARKET-DATA-CONTRACTS
  compatibility: additive_new_public_v1_market_events_and_internal_market_contracts_runtime_and_storage_implementation_deferred
  previous_version: 0.9.0
  public_message_schema_changes: "activates four previously planned V1 names with new payload schemas: market.tick_received.v1, market.bar_closed.v1, market.quality_changed.v1 and market.session_changed.v1; no previously active public schema changes"
  storage_schema_changes: "adds logical STORAGE-MARKET-DATA authority, optional tick/bar durability, immutable calendar/checkpoint semantics and explicit gap evidence; no database object or migration is created"
  error_catalog_change: none
  runtime_code_change: "none in TASK-020; TASK-023 remains blocked and owns a future implementation only after TASK-020 and TASK-022 trusted completion"
  review_change: none
  contract_change: "freezes public Market event payloads, MarketGateway DTO/Port outcomes, versioned calendar/session/quality semantics, bounded backpressure, deterministic Bar aggregation, recovery and replay"
  semantic_validation_change: "requires schema then semantic validation for time/order/version/identity, quality-reason and recovery evidence, gap ranges, snapshot health, capacity/watermarks, calendar/session binding, OHLC, finality, checksums and LIVE/REPLAY determinism"
  internal_contracts_added: [CONTRACT-MARKET-DATA-V1, PORTS-MARKET, WF-MARKET-DATA, STORAGE-MARKET-DATA]
  public_contracts_added: [CONTRACT-MARKET-TICK-RECEIVED-V1, CONTRACT-MARKET-BAR-CLOSED-V1, CONTRACT-MARKET-QUALITY-CHANGED-V1, CONTRACT-MARKET-SESSION-CHANGED-V1]
  task_queue_change: "TASK-020 remains active/draft/in-progress pending independent Review; TASK-023 remains blocked and is constrained to the frozen contracts; no other task changes state"
  affected_tasks: [TASK-020, TASK-021, TASK-023, TASK-024, TASK-026]
  deployment_order:
    - independently_review_and_merge_TASK_020_contracts
    - human_authorized_TASK_020_closeout_with_trusted_delivery_evidence
    - keep_TASK_023_blocked_until_TASK_020_and_TASK_022_are_trusted_completed
    - separately_human_authorize_TASK_023_runtime_implementation
    - deploy_schema_compatible_consumers_before_market_event_publishers
    - verify_shadow_ingress_gap_recovery_and_live_replay_determinism
    - enable_bounded_publishers_without_silent_drop
  migration:
    runtime_data: "not applicable in TASK-020 because no Market runtime is implemented"
    public_events: "new event names have no historical published payload; deploy accepted readers before future publishers and reject unknown versions fail-closed"
    storage: "no migration is created or authorized; future persistence requires independently authorized expand-only storage work"
    task_queue: "TASK-020 remains active; TASK-023 remains blocked on TASK-020 and TASK-022; no downstream activation"
    historical_evidence: "missing upstream ranges remain explicit GAP/UNAVAILABLE evidence and are never inferred or silently backfilled"
    destructive_backfill: forbidden
  rollback:
    runtime_data: not_applicable_no_runtime_change
    public_events: "before runtime adoption revert only unimplemented routes; after adoption stop publishers before readers and preserve every emitted event, gap and quality record"
    task_queue: "keep TASK-020 active until independent Review; keep TASK-023 and downstream tasks blocked"
    contracts: "never reuse the four public names or change V1 meaning; rollback stops incompatible publishers and retains compatible readers"
    storage: "no database rollback in TASK-020; future rollback preserves final bars, checkpoints, calendars and gap evidence"
    release: prohibited
