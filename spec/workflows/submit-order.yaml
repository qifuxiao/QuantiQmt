workflow:
  id: WF-SUBMIT-ORDER
  input: strategy.submit_order_intent.v1
  correlation_key: intent_id
  steps:
    - id: validate_intent
      owner: OrderApplication
      failure: reject_without_side_effect
      identity_rule: "intent_id must be canonical lower-case UUID compatible with oms.order_registered.v1"
      invalid_identity: QQ-OMS-5001
    - id: register_order
      owner: OMS
      transaction: "Order + OrderRegistered + Outbox"
      idempotency_key: intent_id
      failure: no_broker_side_effect
      contract: WF-ORDER-COMMIT.registration
      persisted_identity: [order_id, intent_id, client_order_id, broker, broker_capability_version]
    - id: build_risk_snapshot
      owner: OrderApplication
      failure: fail_closed
      output_contract: CONTRACT-RISK-INPUT-V1
      guards:
        - immutable_input_version_verified
        - order_account_portfolio_instrument_identity_match
        - one_version_per_snapshot_source
      failure_errors: [QQ-RISK-4003, QQ-RISK-4004, QQ-RISK-4006, QQ-RISK-4008, QQ-RISK-4010]
    - id: evaluate_risk
      owner: RiskEngine
      input_contracts: [CONTRACT-RISK-INPUT-V1, CONTRACT-RISK-RULE-SET-V1]
      output_contract: CONTRACT-RISK-DECISION-V1
      timeout: QQ-RISK-4005
      timeout_semantics: "original monotonic deadline covers final validation/freeze/handback; one bounded cleanup yields a validated TIMEOUT_GUARD REJECT or local no-valid-audit failure; late PASS is forbidden"
      pure_evaluator: "no I/O, database, broker, mutable global state, business clock, or monotonic clock"
      ordering: PORTS-RISK
    - id: apply_risk_decision
      owner: OMS
      guard: expected_order_version
      reject_terminal: REJECTED
      version_conflict: QQ-COMMON-1003
      pass_requires:
        - decision_origin_is_evaluator
        - semantic_hash_verified
        - input_and_rule_set_versions_match_request
    - id: start_execution_attempt
      owner: ExecutionEngine
      guard: "leader && valid_fencing_token && trading_mode_allows"
      persist_before_external_call: true
    - id: broker_submit
      owner: BrokerGateway
      idempotency_key: client_order_id
      timeout: SUBMIT_UNKNOWN
      input_contract: CONTRACT-EXECUTION-BROKER-GATEWAY-V1.SubmitOrderRequest
      output_contract: CONTRACT-EXECUTION-BROKER-GATEWAY-V1.OperationResult
      pre_dispatch_guards: [deadline, persisted_broker_binding_BOUND, fencing_token, persisted_capability_version_match, client_order_id, rate_limit]
      capability_version_source: OrderRegistration.broker_capability_version
      unbound_registration: reject_before_dispatch
    - id: merge_report
      owner: OMS
      duplicate_safe: true
      out_of_order_safe: true
  forbidden:
    - risk_before_order_registration
    - broker_call_before_persisted_approval
    - blind_retry_after_unknown_outcome
    - execution_advances_oms_business_state
  unknown_outcome:
    outcome: UNKNOWN_OUTCOME
    error: QQ-EXEC-6003
    identity: "preserve attempt_id, idempotency_key, and client_order_id"
    blind_retry: forbidden
    required_next_step: "query_order/open_orders/trades reconciliation before any decision"
  success_evidence:
    - OrderRegistered
    - RiskDecision
    - ExecutionAttemptStarted
    - BrokerReportOrExplicitUnknown
  persistence:
    accepted_transition_contract: WF-ORDER-COMMIT.transition_commit
    duplicate_intent: identical_no_op_or_QQ-STORAGE-7001
    commit_uncertain: query_before_retry_same_ids_and_message_ids
  risk_audit:
    output_contract: CONTRACT-RISK-AUDIT-OUTPUT-V1
    semantic_validator: PORTS-RISK.RiskAuditSemanticValidator
    validate_before: [v1_projection, approved_transition_and_audit_outbox_commit]
    validation_failure: "fail closed; do not repair/reorder, do not project or publish v1/v2, and do not enter execution"
    finalization: primitive_candidate_then_Draft_2020_12_then_PORTS_RISK_semantics_then_deep_freeze
    no_valid_audit:
      outcome: local_failure_without_decision
      interface: PORTS-RISK.RiskRunFailure
      forbidden: [fabricated_decision, automatic_oms_rejected, v1_projection, v1_v2_publication, approved_transition, execution, retry_by_exception_name_or_text]
      order_state: preserve_registered_state_and_identity_for_explicit_application_failure_handling
      audit: retain_failure_diagnostics_without_fabricating_risk_order_evaluated_event
      retry: no_automatic_retry_requires_explicit_application_policy_and_new_verified_input
      cleanup_failure: preserve_original_selected_failure_and_separate_cleanup_classification
      error_mapping: never_reuse_QQ_RISK_4008_for_output_validation_or_cleanup_failure
    authoritative_event: risk.order_evaluated.v2
    compatibility_event: risk.order_evaluated.v1
    event_projection_mapping: PORTS-RISK
    both_events_persist_before_execution: true
    audit_publish_failure: "fail closed; approved transition and both risk audit Outbox records must be committed before execution"
