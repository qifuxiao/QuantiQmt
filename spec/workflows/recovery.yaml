workflow:
  id: WF-RECOVERY
  new_order_barrier: closed
  steps:
    - {id: load_config, owner: Supervisor, failure: HALTED}
    - {id: verify_schema_clock_trading_day, owner: Supervisor, failure: HALTED}
    - {id: connect_postgresql_redis, owner: Supervisor, failure: SAFE}
    - {id: restore_system_mode_kill_switch, owner: TradingCore, failure: HALTED}
    - {id: acquire_lease_fencing, owner: OMS, failure: STANDBY}
    - id: restore_snapshot_and_journal
      owner: OMS
      failure: HALTED
      order_restore:
        - page_order_ids_with_OrderRepository_list_recovery_order_ids
        - read_journal_head
        - load_highest_valid_snapshot_not_above_head_with_SnapshotLookup_status
        - verify_snapshot_checksum_and_journal_head_checksum
        - record_QQ-STORAGE-7003_discard_snapshot_and_full_journal_replay_when_snapshot_invalid
        - verify_contiguous_versions_and_checksum_chain
        - restore_identity_state_facts_conflicts_sequences_and_mappings
        - compare_rebuilt_state_with_orders_projection
        - rebuild_projection_from_journal_when_projection_mismatch
    - id: restore_portfolio_snapshot_and_ledger
      owner: PortfolioProjection
      failure: HALTED_IF_LEDGER_OR_REPLAY_INVALID
      portfolio_restore:
        - load_highest_supported_snapshot_not_above_ledger_head
        - verify_projection_state_checksum_schema_checkpoint_and_transaction_checksum
        - record_QQ-STORAGE-7003_and_discard_invalid_or_incompatible_snapshot_for_attempt
        - fallback_to_full_ledger_replay_when_snapshot_absent_or_discarded
        - replay_strictly_contiguous_internal_ledger_sequence
        - reconstruct_exact_ledger_derived_projection_state_fields_and_verify_final_projection_state_checksum
        - validate_snapshot_currency_and_versioned_market_observations_outside_projection_state_checksum
        - record_QQ-RECOVERY-8003_open_case_and_keep_barrier_closed_on_mismatch
    - {id: connect_broker, owner: BrokerGateway, failure: SAFE}
    - {id: query_open_orders, owner: Reconciliation, failure: SAFE}
    - {id: query_trades_overlap_window, owner: Reconciliation, failure: SAFE}
    - {id: query_account_positions, owner: Reconciliation, failure: SAFE}
    - {id: classify_differences, owner: Reconciliation, failure: HALTED_IF_UNSAFE}
    - {id: apply_approved_repairs, owner: Reconciliation, failure: SAFE}
    - id: verify_outbox_inbox_projection_lag
      owner: Supervisor
      failure: SAFE
      checks:
        - no_critical_order_message_dead_letter
        - expired_outbox_leases_reclaimable
        - outbox_oldest_pending_age_within_recovery_budget
        - consumer_inbox_and_projection_lag_within_budget
    - {id: open_recovery_barrier, owner: TradingCore, guard: all_completion_conditions, output: committed_RECOVERY_BARRIER_read_through_RecoveryBarrierReadPort}
    - {id: start_market_and_strategies, owner: Supervisor, guard: recovery_barrier_open}
  completion_conditions:
    - all_active_orders_definite_or_suspended_case
    - broker_trade_query_complete
    - account_and_position_snapshots_fresh
    - no_unapproved_p0_p1_difference
    - valid_fencing_token
    - recovery_report_persisted
    - order_journal_versions_and_checksums_verified
    - portfolio_ledger_sequence_versions_and_checksums_verified
    - no_critical_order_outbox_dead_letter
  recovery_passed_input:
    contract: logical_RecoveryBarrierReadPort_snapshot_not_public_JSON_DTO
    validation: CONTRACT-CONTROL-SEMANTIC-VALIDATION-V1_ValidateRecoveryPassed
    required_binding: [exact_scope_and_reference, barrier_id, generation, barrier_version, stored_checksum, OPEN_state, opened_at, evidence_freshness, lease_and_fence, complete_six_gate_evidence]
    checksum_role: content_integrity_not_source_authenticity
    authenticity: controlled_Port_committed_transaction_and_exact_query_key
  order_failure_rules:
    invalid_snapshot: "diagnose QQ-STORAGE-7003, discard snapshot for this recovery attempt, and replay full Journal"
    journal_gap_or_corruption: "QQ-RECOVERY-8002 + HALTED; never open barrier"
    orders_projection_mismatch: "call OrderRepository.rebuild_projection_from_journal with expected journal head checksum, preserve evidence, open case"
    outbox_publish_uncertain: "retain same message_id and allow duplicate publication"
    unbound_registration: "preserve UNBOUND, prohibit Broker dispatch, keep SAFE and require reconciliation evidence"
  portfolio_failure_rules:
    invalid_or_incompatible_snapshot: "diagnose QQ-STORAGE-7003, discard snapshot for this attempt, and replay full AccountLedger"
    lower_snapshot_after_invalid: forbidden_in_same_recovery_attempt
    ledger_gap_or_checksum_mismatch: "QQ-RECOVERY-8003 + HALTED; never open barrier"
    broker_position_difference: "append Reconciliation evidence/Case only; never overwrite internal projection"
