workflow:
  id: WF-TRADE-ACCOUNTING
  input: broker.trade_reported.v1
  input_dto: CONTRACT-LEDGER-ACCOUNTING-V1.TradeAccountingRequest
  outputs:
    ledger: CONTRACT-LEDGER-ACCOUNTING-V1.LedgerTransaction
    result: CONTRACT-LEDGER-ACCOUNTING-V1.PostResult
    position: CONTRACT-PORTFOLIO-PROJECTION-V1.PositionProjectionChange
  correlation_key: broker_account_trading_day_trade_id
  bounded_deadline_required: true
  steps:
    - id: validate_and_deduplicate_trade
      owner: OMS
      unique_key: "broker+account+trading_day+trade_id"
      fingerprint: sha256_canonical_authoritative_broker_trade_projection_with_explicit_nulls_and_unicode_nfc
      fingerprint_fields: [account_id, broker, broker_order_id, broker_sequence, client_order_id, commission, fee, instrument_id, order_id, position_effect, price, quantity, received_at, side, tax, trade_id, trade_time, trading_day]
      same_fingerprint: duplicate_no_op
      different_fingerprint: QQ-STORAGE-7009_open_reconciliation_case
    - {id: update_order_and_publish_trade_recorded, owner: OMS, transaction: "Order + Trade + Outbox"}
    - id: resolve_account_currency_and_internal_order
      owner: AccountLedger
      resolved_order_id: required_canonical_internal_order_uuid
      unresolved_conditions: [order_id_missing, order_id_null, order_id_invalid_uuid, order_id_not_found]
      unresolved_reason: TRADE_MISSING_INTERNAL
      unresolved_effect: append_reconciliation_evidence_or_case_only
      forbidden_outputs_when_unresolved: [TRADE_ACCOUNTING_REQUEST, LEDGER_TRANSACTION, LEDGER_ENTRY, POSITION_PROJECTION_CHANGE]
      selection_key: [scope_id, currency, account_type, instrument_id]
      required_cardinality: exactly_one_active_taxonomy_valid_account_per_key
      frozen_versions: [account_mapping_version, accounting_policy_version, fee_policy_version, rounding_policy_version]
      unresolved: fail_closed_before_accounting_or_projection
    - id: build_deterministic_balanced_transaction
      owner: AccountLedger
      contract: CONTRACT-LEDGER-ACCOUNTING-V1
      cost_basis_method: WEIGHTED_AVERAGE_V1
      rounding_policy: CURRENCY_MINOR_UNIT_HALF_EVEN_V1
      failure: QQ-STORAGE-7005_or_specific_validation_code
    - id: append_ledger_and_outbox
      owner: AccountLedger
      transaction: "Inbox + LedgerTransaction + LedgerEntries + Outbox + Audit"
      expected_sequence: required
      uncertain_commit: query_same_transaction_and_idempotency_identity
      uncertain_result: UNKNOWN_QQ-STORAGE-7012_reconciliation_required
      partial_write: rollback_all
    - id: update_position_projection
      owner: PortfolioProjection
      transaction: "ProjectionJournal + Position CAS + Portfolio CAS + Checkpoint + Outbox"
      duplicate_safe: true
      versions: increment_exactly_once
      sequence: contiguous_internal_ledger_sequence
      uncertain_result: UNKNOWN_QQ-STORAGE-7013_reconciliation_required
    - id: release_t_plus_one_availability
      owner: PortfolioProjection
      input: CONTRACT-PORTFOLIO-PROJECTION-V1.SettlementReleaseRequest
      result: CONTRACT-PORTFOLIO-PROJECTION-V1.SettlementReleaseResult
      guards: [verified_calendar_version_and_session, unchanged_ledger_checkpoint, exact_position_and_portfolio_cas, valid_fencing, release_not_above_unavailable]
      effect: quantity_delta_zero_available_quantity_increase_versions_plus_one_checkpoint_unchanged
      duplicate: return_original_without_version_increment
      uncertain_result: UNKNOWN_QQ-STORAGE-7014_query_same_release_identity
    - {id: publish_risk_snapshot_change, owner: PortfolioProjection}
  invariants:
    - broker_fact_is_never_rolled_back
    - ledger_debits_equal_credits_per_currency
    - downstream_failure_replays_from_inbox
    - ledger_and_projection_history_are_append_only
    - broker_position_never_overwrites_internal_projection
    - decimal_float_is_forbidden
    - duplicate_trade_never_increments_ledger_position_or_portfolio_version
  identity:
    transaction_namespace_uuid: 6ea9f94d-16c3-5c7a-8c4f-ec1883388613
    transaction_id: uuid5_namespace_and_canonical_trade_identity
    entry_id: uuid5_transaction_id_and_canonical_zero_based_entry_ordinal
    buy_entry_slots: {POSITION_COST: 0, COMMISSION: 1, FEE: 2, TAX: 3, CASH: 4, ROUNDING_RESIDUAL: 5}
    sell_entry_slots: {CASH: 0, COMMISSION: 1, FEE: 2, TAX: 3, POSITION_COST: 4, REALIZED_PNL: 5, ROUNDING_RESIDUAL: 6}
    idempotency_key: "broker|account_id|trading_day|trade_id"
    settlement_release_id: 'UUID5(position_id, "settlement:" + trading_day + ":" + availability_policy_version)'
    settlement_request_fingerprint: canonical_business_calendar_checkpoint_versions_excluding_request_and_deadline_times
  arrival:
    broker_sequence: reconciliation_evidence_not_posting_order
    unseen_out_of_order_trade: post_at_next_internal_ledger_sequence
    unresolved_order_or_mapping: do_not_post_open_or_update_case
    close_exceeds_internal_position: do_not_post_QQ-RECOVERY-8001
  posting:
    buy: [debit_position_cost, debit_nonzero_commission_fee_tax, credit_cash_total]
    sell: [debit_cash_net, debit_nonzero_commission_fee_tax, credit_released_position_cost, post_trade_pnl_directionally]
    zero_components: omitted_without_renumbering_fixed_entry_slots
    fee_source: authoritative_broker_trade_fee_amount_currency_and_rounding_policy
    fee_policy: BROKER_CHARGES_V1
    full_close: quantity_zero_cost_zero_average_cost_null
    realized_pnl: cumulative_trade_pnl_minus_commission_fee_tax
  availability:
    policy_source: versioned_account_instrument_configuration
    implementation_default: forbidden
    IMMEDIATE_V1: "BUY and SELL apply quantity delta to available quantity; SELL requires sufficient availability"
    T_PLUS_ONE_V1: "BUY leaves availability unchanged; SELL decrements availability; verified release preserves the Ledger checkpoint and increments Position/Portfolio versions exactly once"
    broker_available_quantity: reconciliation_evidence_only
  retry:
    semantic_failure: never
    version_conflict: reread_then_bounded_retry_with_same_input_and_deadline
    rolled_back_dependency_failure: bounded_same_identity_retry
    commit_unknown: query_same_identity_never_generate_replacement
  order_merge:
    fact_identity: "broker+account_id+trading_day+trade_id"
    fact_identity_required: true
    duplicate: idempotent_no_op_without_order_version_increment
    cumulative_source: "sum quantity exactly once for each accepted unique broker trade identity"
    candidate_cumulative: "stored trade-derived cumulative quantity + current unseen unique Trade.quantity"
    broker_report_cumulative: "reconciliation evidence only; mismatch opens case and cannot overwrite trade-derived cumulative quantity"
    stale_or_out_of_order: "deduplicate by trade identity, then add unseen trade quantity irrespective of arrival order"
    during_cancel: "trade remains authoritative in CANCEL_PENDING and CANCEL_UNKNOWN"
    invalid_quantity: "reject QQ-OMS-5002 before state/version mutation"
    persistence: "accepted Order transition follows WF-ORDER-COMMIT.transition_commit"
    duplicate_persistence: "no Journal, Outbox, Ledger or aggregate version increment"
