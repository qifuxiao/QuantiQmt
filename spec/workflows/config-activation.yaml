workflow:
  id: WF-CONFIG-ACTIVATION
  input: config_candidate
  steps:
    - {id: persist_candidate, owner: ConfigService}
    - {id: schema_and_business_validate, owner: ConfigService, failure: reject_candidate}
    - {id: prepare_required_components, owner: ConfigService, failure: reject_candidate}
    - {id: persist_candidate_active_version, owner: ConfigService, transaction: "ActiveVersion(candidate) + config.version_activated.v1(CANDIDATE_COMMIT) + Outbox", timing: before_component_swap_or_ACK}
    - {id: swap_immutable_snapshots, owner: Components, guard: safe_boundary}
    - {id: collect_acknowledgements, owner: ConfigService, success: persist_APPLIED_without_second_public_event, failure: enter_safe_scope_and_rollback}
    - {id: collect_rollback_effects, owner: ConfigService, guard: candidate_effect_not_complete, failure: remain_PARTIAL_or_UNKNOWN_and_reconcile_same_identity}
    - {id: persist_rollback_restore, owner: ConfigService, guard: complete_rollback_effects_to_one_previous_accepted_version, transaction: "ActiveVersion(previous accepted) + config.version_activated.v1(ROLLBACK_RESTORE) + Outbox", failure: remain_UNKNOWN_and_reconcile_same_identity}
    - {id: persist_rolled_back_result, owner: ConfigService, guard: rollback_restore_transaction_committed}
  invariants:
    - one_risk_decision_uses_one_rule_set_version
    - secrets_are_references_not_plaintext
    - partial_silent_activation_is_forbidden
    - public_activation_event_never_claims_component_effects_or_convergence
    - activation_sequence_strictly_increases_for_candidate_commit_and_rollback_restore
  result_contract:
    identity: [CONFIG_ACTIVATION, config_domain, candidate_version, idempotency_key]
    canonical_result_fingerprint: required
    prior_result_source: exact_committed_VersionedConfigStorePort_record
    exact_duplicate: return_persisted_result_before_mutable_active_state
    same_identity_different_content: QQ-STORAGE-7001
    component_evidence:
      exact_key_set: required_components
      binds: [component_id, generation, capability_version, activation_mode, safe_boundary]
      prepare: [PREPARED, REJECTED, UNKNOWN]
      candidate_effect: [NOT_ATTEMPTED, APPLIED, REJECTED, UNKNOWN]
      rollback_effect: [NOT_REQUIRED, APPLIED, REJECTED, UNKNOWN]
    outcomes:
      APPLIED: candidate_commit_event_reference_all_candidate_effects_APPLIED_rollback_NOT_REQUIRED_no_second_public_event
      REJECTED: no_new_active_no_candidate_APPLIED_rollback_NOT_REQUIRED
      PARTIAL: candidate_remains_active_no_restore_event_fail_closed_ENTER_SAFE_MODE_reconcile_same_identity
      ROLLED_BACK: complete_rollback_effects_then_atomic_rollback_restore_event_then_result_binds_both_event_references
      UNKNOWN: candidate_commit_unknown_has_no_event_or_active_claim; post_candidate_commit_unknown_retains_candidate_event_and_active_authority; both_have_no_restore_event_ENTER_SAFE_MODE_query_same_identity_never_change_key
    public_event:
      meaning: ActiveVersion_authority_change_not_component_convergence
      CANDIDATE_COMMIT: after_prepare_before_swap_and_ACK
      ROLLBACK_RESTORE: after_complete_rollback_effects_before_ROLLED_BACK_result
      component_effect_fields: forbidden
    checksum_role: stored_content_integrity_not_source_authenticity
    source_authenticity: VersionedConfigStorePort_and_transaction_integration
  risk_rule_set:
    schema: CONTRACT-RISK-RULE-SET-V1
    hard_limit_source: accepted_immutable_system_hard_limit_policy
    validation:
      - hard_limit_policy_hash_matches_canonical_policy_including_valuation_currency
      - hard_limit_policy_version_is_accepted
      - candidate_valuation_currency_equals_accepted_policy
      - candidate_system_hard_limits_equal_accepted_policy
      - dynamic_rules_do_not_relax_hard_limits
    failure: QQ-RISK-4007_and_reject_candidate_without_partial_activation
