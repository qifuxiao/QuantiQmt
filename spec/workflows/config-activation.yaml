workflow:
  id: WF-CONFIG-ACTIVATION
  input: config_candidate
  steps:
    - {id: persist_candidate, owner: ConfigService}
    - {id: schema_and_business_validate, owner: ConfigService, failure: reject_candidate}
    - {id: prepare_required_components, owner: ConfigService, failure: reject_candidate}
    - {id: persist_active_version, owner: ConfigService, transaction: "ActiveVersion + Event + Outbox"}
    - {id: swap_immutable_snapshots, owner: Components, guard: safe_boundary}
    - {id: collect_acknowledgements, owner: ConfigService, failure: rollback_or_safe_scope}
  invariants:
    - one_risk_decision_uses_one_rule_set_version
    - secrets_are_references_not_plaintext
    - partial_silent_activation_is_forbidden
  risk_rule_set:
    schema: CONTRACT-RISK-RULE-SET-V1
    hard_limit_source: accepted_immutable_system_hard_limit_policy
    validation:
      - hard_limit_policy_hash_matches_canonical_policy
      - hard_limit_policy_version_is_accepted
      - candidate_system_hard_limits_equal_accepted_policy
      - dynamic_rules_do_not_relax_hard_limits
    failure: QQ-RISK-4007_and_reject_candidate_without_partial_activation
