workflow:
  id: WF-CONTROL-PLANE
  contract: CONTRACT-CONTROL-PLANE-V1
  semantic_validator: CONTRACT-CONTROL-SEMANTIC-VALIDATION-V1
  boundaries: [command_ingress, outbox_persist, event_publish, consumer_apply, control_transition, recovery_restore, external_side_effect]
  validation_order: [validation_context_schema, structural_envelope_or_dto, payload_schema, canonical_fingerprint_recompute, immutable_envelope_payload_binding, identity_collision_decision, mutable_lineage_policy_authority, event_or_command_semantics, final_decision]
  validation_failure: reject_without_repair_reorder_persist_publish_or_execute
  schema_only_probe: never_authorizes_any_boundary
  unified_validator_inputs: [public_control_event, CONFIG_CANDIDATE, KILL_SWITCH_COMMAND, KILL_SWITCH_RESULT]
  observability:
    steps: [normalize_context, redact_sensitive_values, validate_correlation_chain, emit_metric_log_trace_audit]
    failure: reject_record_and_emit_bounded_validation_metric
  alerting:
    trigger: authoritative_metric_threshold_and_sustained_window
    recovery: recovery_threshold_and_window
    dedupe: bounded_alert_id_and_dedupe_window
    silence: explicit_operator_action_with_expiry
    state_authority: forbidden
  config_activation:
    authority: exact_versioned_config_required_components_and_component_capabilities
    steps:
      - {id: persist_candidate, owner: ConfigService}
      - {id: schema_and_business_validate, owner: ConfigService, failure: reject_candidate}
      - {id: prepare_components, owner: ConfigService, failure: reject_candidate}
      - {id: atomic_active_event_outbox_commit, owner: ConfigService, transaction: "ActiveVersion + config.version_activated.v1 + Outbox"}
      - {id: swap_at_safe_boundary, owner: Components, guard: immutable_version_and_checksum}
      - {id: collect_acknowledgements, owner: ConfigService, failure: rollback_or_safe_scope}
    forbidden: [partial_silent_activation, plaintext_secret_persistence, active_version_side_channel]
    unknown: retain_same_candidate_identity_and_reconcile
    canonical_checksum: complete_candidate_security_projection_with_RFC8785_and_only_secret_reference_and_required_component_set_sorting
    hard_limit_guard: exact_currency_policy_content_hash_and_dynamic_limits_not_greater_than_accepted_system_hard_limits
  kill_switch:
    command_bus: required
    on_effect: [block_new_order_intent, block_new_risk_approval, preserve_cancel, preserve_recovery, preserve_approved_reduce_risk]
    stale_expected_version: reject_without_event
    timeout_after_dispatch: UNKNOWN_and_reconcile_same_idempotency_key
    disable_recovery_authority: strict_open_barrier_identity_version_checksum_generation_digest_policy_authorization_and_freshness
    disable_recovery_validation: same_complete_recovery_barrier_validator_as_mode_recovery
    outcomes: {APPLIED: desired_state_and_increment_once, REJECTED: accepted_state_and_version_unchanged, PARTIAL: fail_closed_ON_version_unchanged_reconcile, TIMEOUT: UNKNOWN_version_unchanged_reconcile_same_identity, UNKNOWN: UNKNOWN_version_unchanged_reconcile_same_identity}
  lease:
    acquire_before_side_effect: true
    validate_before_each_side_effect: true
    expiry_or_epoch_regression: fail_closed
  recovery_barrier:
    initial: CLOSED
    open_requires: [CONFIG_VERIFIED, MARKET_FRESH, AUDIT_AVAILABLE, RECONCILIATION_COMPLETE, LEASE_FENCED, OUTBOX_HEALTHY]
    closed_behavior: reject_new_order_intent_and_risk_approval
    reconnect_auto_normal: forbidden
    market_freshness: market_fresh_until_exact_authority_and_strictly_after_injected_evaluation_at
    generic_fresh_until: forbidden
  lineage:
    causation_required_for_control_events: true
    parent_before_child_same_correlation: required
    unknown_future_self_or_cross_correlation_parent: reject
  redaction:
    recursive_forbidden_keys: [password, secret, credential, token, access_token, private_key, raw_account_id, raw_account_identifier]
