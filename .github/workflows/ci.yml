name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Poetry
        run: python -m pip install "poetry>=2,<3"
      - name: Install core development environment
        run: poetry install --with dev
      - name: Validate project metadata
        run: poetry check
      - name: Validate specifications and tasks
        run: poetry run python scripts/validate_specs.py
      - name: Lint
        run: poetry run ruff check .
      - name: Format check
        run: poetry run ruff format --check .
      - name: Type check
        run: poetry run mypy src scripts
      - name: Test
        run: poetry run pytest tests/unit tests/property tests/spec tests/contract --cov --cov-report=term-missing
  persistence-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantiqmt
          POSTGRES_PASSWORD: quantiqmt
          POSTGRES_DB: quantiqmt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantiqmt -d quantiqmt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUANTIQMT_POSTGRES_DSN: postgresql://quantiqmt:quantiqmt@localhost:5432/quantiqmt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Poetry
        run: python -m pip install "poetry>=2,<3"
      - name: Install core development environment
        run: poetry install --with dev --extras storage
      - name: Validate persistence contracts
        run: poetry run pytest tests/unit/order/application tests/contract/persistence tests/integration/persistence
