name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Poetry
        run: python -m pip install "poetry>=2,<3"
      - name: Install core development environment
        run: poetry install --with dev
      - name: Validate project metadata
        run: poetry check
      - name: Validate specifications and tasks
        run: poetry run python scripts/validate_specs.py
      - name: Lint
        run: poetry run ruff check .
      - name: Format check
        run: poetry run ruff format --check .
      - name: Type check
        run: poetry run mypy src scripts
      - name: Test
        run: poetry run pytest --cov --cov-report=term-missing
