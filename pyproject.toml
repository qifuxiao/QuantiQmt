[project]
name = "quantiqmt"
version = "0.1.0"
description = "Enterprise-grade Python quantitative trading system"
authors = [
    {name = "qifuxiao",email = "867225266@qq.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
messaging = [
    "redis>=5,<8",
]
storage = [
    "sqlalchemy>=2,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
]
observability = [
    "structlog>=24,<26",
    "prometheus-client>=0.20,<1",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
]
live-qmt = [
    "xtquant>=250516.1.1,<250517.0.0; sys_platform == 'win32'",
]

[tool.poetry]
packages = [{include = "quantiqmt", from = "src"}]
include = [{path = "src/quantiqmt/contracts/schema_bundle/**/*", format = ["sdist", "wheel"]}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-asyncio = ">=0.24,<2"
pytest-cov = ">=5,<8"
hypothesis = ">=6,<7"
mypy = ">=1.10,<3"
ruff = ">=0.8,<1"
pyyaml = ">=6,<7"
types-pyyaml = ">=6,<7"
pre-commit = ">=3.8,<5"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_mode = "strict"
markers = [
    "unit: isolated unit tests",
    "property: property-based tests",
    "contract: port and message contract tests",
    "integration: tests requiring local infrastructure",
    "performance: benchmark or capacity tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "scripts"]
exclude = ["tests/fixtures"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
source = ["quantiqmt"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
