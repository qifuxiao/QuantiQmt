repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types: [python]
      - id: validate-specs
        name: validate specs and tasks
        entry: poetry run python scripts/validate_specs.py
        language: system
        pass_filenames: false
